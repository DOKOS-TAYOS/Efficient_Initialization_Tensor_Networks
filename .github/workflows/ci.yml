name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint readiness tests
        run: python -m ruff check tests

      - name: Check readiness test formatting
        run: python -m ruff format --check tests

      - name: Run tests
        run: python -m pytest -q

  required-pr-ci:
    name: required-pr-ci
    if: always()
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Verify essential jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          if [ "$QUALITY_RESULT" != "success" ]; then
            echo "Essential CI did not succeed: $QUALITY_RESULT"
            exit 1
          fi
